[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neurowave"
version = "0.1.0"
description = "NeuroWave — headless Music Core for a lightweight Linux Yandex Music client"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Максим Зозин" }]
dependencies = [
    "yandex-music>=3.2,<4",
]

[project.optional-dependencies]
keyring = ["keyring>=24"]
mpris = ["dbus-next>=0.2.3"]
local = ["tinytag>=2.3,<3"]
ui = ["PySide6-Essentials>=6.6"]
desktop = ["dbus-next>=0.2.3", "PySide6-Essentials>=6.6", "keyring>=24"]
dev = ["pytest>=8", "build>=1.2"]

[project.scripts]
neurowave = "neurowave.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: тесты с настоящим mpv (пропускаются, если mpv не установлен)",
]
addopts = "-q"
