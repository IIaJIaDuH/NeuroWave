name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          # PySide6 в CI не нужен: интеграции проверяются на ленивый импорт.
          pip install -e '.[dev,local,mpris]'

      - name: Тесты
        # На раннере нет Secret Service: явно уводим токены в файл,
        # чтобы тесты не зависели от keyring окружения.
        env:
          NEUROWAVE_KEYRING: "off"
        # Qt-тесты требуют PySide6: они вынесены в отдельную джобу.
        run: python -m pytest -q -m "not integration" --ignore=tests/test_ui_qt.py

  # Окно проверяется в offscreen-режиме: без X/Wayland, но с настоящими
  # виджетами и настоящим Qt.
  qt:
    name: Qt window (offscreen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libxkbcommon0
          pip install -e '.[dev,local,mpris,ui]'

      - name: Smoke-тест окна
        env:
          NEUROWAVE_KEYRING: "off"
          QT_QPA_PLATFORM: "offscreen"
        run: >
          python -m pytest -q
          tests/test_ui_qt.py
          tests/test_ui_unknown_duration.py
          tests/test_ui_command_errors.py

  # Слой mpv проверяется настоящим mpv, а не двойником: звук уходит в
  # --ao=null, поэтому звуковая карта не нужна.
  integration:
    name: mpv integration (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить mpv
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mpv
          mpv --version | head -1

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,local,mpris]'

      - name: Тесты с настоящим mpv
        env:
          NEUROWAVE_KEYRING: "off"
        run: python -m pytest -q -m integration
