name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          # PySide6 в CI не нужен: интеграции проверяются на ленивый импорт.
          pip install -e '.[dev,local,mpris]'

      - name: Тесты
        # На раннере нет Secret Service: явно уводим токены в файл,
        # чтобы тесты не зависели от keyring окружения.
        env:
          NEUROWAVE_KEYRING: "off"
        run: python -m pytest -q
